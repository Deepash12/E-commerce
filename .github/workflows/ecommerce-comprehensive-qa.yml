name: E-commerce Comprehensive QA (One Commit)
on:
  workflow_dispatch:
    inputs:
      run_mutations:
        description: 'Enable database-changing tests ONLY for isolated QA database'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_BASE_URL: https://e-commerce-2-ibeq.onrender.com
      QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
      QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest dependencies
        run: python -m pip install -r requirements-qa.txt
      - name: Wake Render service
        run: |
          python - <<'PYTHON'
          import os,time,requests
          url=os.environ['QA_BASE_URL']+'/v3/api-docs'
          for attempt in range(24):
              try:
                  response=requests.get(url,timeout=40)
                  if response.status_code==200:
                      print('Service ready');break
                  print('HTTP',response.status_code)
              except requests.RequestException as exc:
                  print(type(exc).__name__)
              time.sleep(10)
          else:
              raise SystemExit('Service not ready after retries')
          PYTHON
      - name: Run full test collection
        shell: bash
        env:
          RUN_MUTATIONS: ${{ inputs.run_mutations }}
        run: |
          set -o pipefail
          if [[ "$RUN_MUTATIONS" == "true" ]]; then
            pytest tests/test_v3_readonly.py tests/test_v3_mutations.py tests/test_v4_deep_readonly.py tests/test_v4_negative_mutations.py -v --mutations --junitxml=junit-comprehensive.xml 2>&1 | tee qa-comprehensive-log.txt
          else
            pytest tests/test_v3_readonly.py tests/test_v3_mutations.py tests/test_v4_deep_readonly.py tests/test_v4_negative_mutations.py -v --junitxml=junit-comprehensive.xml 2>&1 | tee qa-comprehensive-log.txt
          fi
      - name: Upload report (even if tests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-comprehensive-qa-results
          path: |
            junit-comprehensive.xml
            qa-comprehensive-log.txt
          if-no-files-found: warn
