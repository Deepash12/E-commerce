name: Deployed E-commerce QA
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'
permissions:
  contents: read
jobs:
  smoke-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-qa.txt
      - run: python -m pip install -r requirements-qa.txt
      - name: Run deployed API smoke and security checks
        env:
          API_BASE_URL: https://e-commerce-2-ibeq.onrender.com
          FRONTEND_URL: https://e-commerce-frontend-iota-eight.vercel.app/
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
        run: |
          mkdir -p qa-results
          python -m pytest tests -v --junitxml=qa-results/junit.xml > qa-results/test-output.txt 2>&1 || RESULT=$?
          cat qa-results/test-output.txt
          exit ${RESULT:-0}
      - name: Upload QA results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-qa-results
          path: qa-results/
          retention-days: 30
